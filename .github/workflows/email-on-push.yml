name: Push Notification Email

on:
  push:
    branches: main

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Data
        run: |
          MSG="${{ github.event.head_commit.message }}"
          
          # Extract username
          [[ "$MSG" =~ @([a-zA-Z0-9_-]+) ]] && REV="${BASH_REMATCH[1]}" || REV="None"
          
          # Generate time in India using standard Linux Bash format
          TIME=$(TZ="Asia/Kolkata" date '+%d/%m/%Y %H:%M:%S.%3N')
          
          # Save to environment variables
          echo "MSG=$MSG" >> $GITHUB_ENV
          echo "REV=$REV" >> $GITHUB_ENV
          echo "TIME=$TIME" >> $GITHUB_ENV

      - name: Send Mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Code Review Requested"
          to: ${{ secrets.HEAD_MAIL }}
          from: GitHub Actions
          body: |
            Commit Message: ${{ env.MSG }}
            Submitted By: ${{ github.actor }}
            Submitted On: ${{ env.TIME }}
            Reviewer: @${{ env.REV }}
